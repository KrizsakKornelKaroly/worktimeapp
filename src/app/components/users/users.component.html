<div class="card xs:col-12 lg:col-6 mx-auto px-3 text-center">
    <h2>Users</h2>
    <p>Registered users list</p>

    <p-table 
        [value]="users" 
        [tableStyle]="{ 'min-width': '50rem' }" 
        [paginator]="true" 
        [rows]="10" 
        [rowsPerPageOptions]="[5, 10, 20, 50]"
        stripedRows="true",
        selectionMode="single"
    >
    <!--TODO: implementing search-filter -->
    <ng-template #header>
        <tr>
            <th pSortableColumn="index"># <p-sortIcon field="index" /></th>
            <th pSortableColumn="name">Name <p-sortIcon field="name" /></th>
            <th pSortableColumn="email">Email <p-sortIcon field="email" /></th>
            <th pSortableColumn="reg">Registration <p-sortIcon field="reg" /></th>
            <th pSortableColumn="last">Last Login <p-sortIcon field="last" /></th>
            <th class="text-right">Operations</th>
        </tr>
    </ng-template>
    <ng-template #body let-user let-rowIndex="rowIndex">
        <tr>
            <td >{{ rowIndex + 1 }}</td>
            <td >{{ user.name }}</td>
            <td >{{ user.email }}</td>
            <td >{{ user.reg | date: "yyyy-MM-dd HH:mm:ss" }}</td>
            <td >{{ user.last | date: "yyyy-MM-dd HH:mm:ss" }}</td>
            <td class="text-right">
                <p-toggleswitch [(ngModel)]="user.status" (click)="updateUserStatus(user.id)" />
            </td>
        </tr>
    </ng-template>
</p-table>


</div>
