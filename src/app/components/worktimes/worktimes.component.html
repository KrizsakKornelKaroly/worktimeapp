<div class="card xs:col-12 lg:col-6 mx-auto px-3 text-center">
    <h2>Worktimes</h2>
    <p>Registered worktimes list</p>

    <p-floatlabel class="w-full md:w-56" variant="on">
        <p-select 
            [(ngModel)]="selectedUser" 
            inputId="on_label" 
            [options]="users" 
            optionLabel="name" 
            optionValue="id"
            styleClass="w-full text-left" 
            [filter]="true" 
            filterBy="name" 
            [showClear]="true"
            (change)="getWorkTimes(selectedUser ? selectedUser.id : null)"
        />
        <label for="on_label">Users</label>
    </p-floatlabel>

    <p-button icon="pi pi-plus" styleClass="w-full my-2" routerLink="/worktimes/new" label="New worktime"></p-button>
    <!--Table-->

        <p-table 
        [value]="worktimes" 
        [tableStyle]="{ 'min-width': '50rem' }" 
        [paginator]="true" 
        [rows]="10" 
        [rowsPerPageOptions]="[5, 10, 20, 50]"
        stripedRows="true",
        selectionMode="single"
    >
    <!--TODO: implementing search-filter -->
    <ng-template #header>
        <tr>
            <th pSortableColumn="index"># <p-sortIcon field="index" /></th>
            <th pSortableColumn="date">Date <p-sortIcon field="date" /></th>
            <th pSortableColumn="user.name">User <p-sortIcon field="user.name" /></th>
            <th pSortableColumn="start">Start <p-sortIcon field="start" /></th>
            <th pSortableColumn="end">End <p-sortIcon field="end" /></th>
            <th class="text-right">Operations</th>
        </tr>
    </ng-template>
    <ng-template #body let-worktime let-rowIndex="rowIndex">
        <tr>
            <td >{{ rowIndex + 1 }}</td>
            <td >{{ worktime.date | date: "yyyy-MM-dd" }}</td>
            <td >{{ worktime.user.name }}</td>
            <td >{{ worktime.start}}</td>
            <td >{{ worktime.end }}</td>
            <td class="text-right">
                <p-button icon="pi pi-pencil" routerLink="/worktimes/{{ worktime.id }}" severity="warn" class="mr-2"></p-button>
                <p-button icon="pi pi-trash" (click)="delete(worktime.id)" severity="danger"></p-button>
            </td>
        </tr>
    </ng-template>
</p-table>


</div>
